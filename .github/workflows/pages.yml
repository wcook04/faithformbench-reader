name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.7.0'
      - name: Install the locked Python dependencies
        run: |
          python -m pip install --quiet uv
          uv sync --extra test --frozen
      - run: uv run pytest -q
      - run: node --test reader/lean-tokens.test.mjs reader/step-math.test.mjs
      - name: Download the pinned release and compare each file with its recorded SHA-256
        run: uv run python -m faithformbench_reader download
      # The counts and examples are recomputed from the release and must equal the committed files.
      - name: Recompute the counts and the seeded examples
        run: |
          uv run python -m faithformbench_reader counts
          uv run python -m faithformbench_reader examples
          git diff --exit-code -- results/counts.json results/examples.md
      - name: Build the reader
        run: uv run python -m faithformbench_reader site
      # Fails if KaTeX displays a character that differs from the released step text.
      - name: Check the typesetting of every step text
        run: |
          node reader/step-math.check.mjs site --out results/step_math_check.json --examples 0
          git diff --exit-code -- results/step_math_check.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
