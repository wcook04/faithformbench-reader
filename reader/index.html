    <title>FaithformBench Reader: reasoning steps beside their Lean formalisations</title>
    <meta name="description" content="An independent reader for the public results of FaithformBench, a benchmark by Rob Cornish, Iacopo Ghinassi and coauthors. Each reasoning step in their release is shown with the Lean 4 statement each of four autoformalisers produced for it and the prover's verdict. Counts and notes computed from the released text were added by this site." />
    <meta name="theme-color" content="#ebe2d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#150f1e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="plectis.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/plectis-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/plectis-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="katex/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="katex/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="katex/katex.min.css" />
    <link rel="stylesheet" href="reader.css" />
    <script src="theme-init.js"></script>
    <script defer src="katex/katex.min.js"></script>
    <link rel="modulepreload" href="lean-tokens.js" />
    <link rel="modulepreload" href="step-math.js" />

  <body>
    <div id="root"><p class="status">Loading the reasoning chains.</p></div>

    </noscript>
    <script type="module" src="reader.js"></script>
  </body>
</html>
